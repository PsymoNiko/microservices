<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Workflow Graph Studio | Drag, Connect, Visualize</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #eef2f8;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .app {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* two column layout */
        .split-pane {
            display: flex;
            flex-wrap: wrap;
        }
        .editor {
            flex: 1.2;
            min-width: 320px;
            background: #fafcff;
            border-right: 1px solid #e2e8f0;
            padding: 20px;
            overflow-y: auto;
            max-height: 70vh;
        }
        .graph-pane {
            flex: 2.5;
            min-width: 500px;
            background: #ffffff;
            position: relative;
            height: 70vh;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }
        .toolbar {
            padding: 12px 20px;
            background: #f1f5f9;
            border-top: 1px solid #e2e8f0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        button, .preset-btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.1s;
        }
        button:hover { background: #0f172a; }
        .preset-btn { background: #475569; }
        .node-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            margin: 15px 0;
        }
        .node-table th, .node-table td {
            border-bottom: 1px solid #e2e8f0;
            padding: 8px 6px;
            text-align: left;
            vertical-align: top;
        }
        .node-table input, .node-table textarea {
            width: 100%;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 0.75rem;
        }
        .node-table textarea { height: 50px; resize: vertical; }
        .remove-node { background: none; border: none; color: #dc2626; cursor: pointer; font-size: 1.2rem; }
        .add-btn { margin: 8px 0; background: #2563eb; }
        .edge-row {
            display: flex;
            gap: 10px;
            margin: 6px 0;
            align-items: center;
            flex-wrap: wrap;
        }
        .edge-row select { padding: 6px; border-radius: 20px; border: 1px solid #cbd5e1; }
        .row-assign {
            margin: 12px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .row-badge {
            background: #eef2ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .info-text {
            font-size: 0.7rem;
            color: #475569;
            margin-top: 12px;
        }
        hr { margin: 15px 0; }
        @media (max-width: 900px) {
            .split-pane { flex-direction: column; }
            .graph-pane { min-width: auto; height: 400px; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="split-pane">
        <!-- Left editor panel -->
        <div class="editor">
            <h3 style="margin-top:0;">📋 Nodes & Connections</h3>
            <button id="addNodeBtn" class="add-btn">+ Add Node</button>
            <table class="node-table" id="nodeTable">
                <thead><tr><th>Name</th><th>Runtime steps (comma)</th><th>Row</th><th></th></tr></thead>
                <tbody id="nodeTbody"></tbody>
            </table>
            
            <h3>🔗 Connections (edges)</h3>
            <div id="edgesContainer"></div>
            <button id="addEdgeBtn" style="background:#2563eb; margin-bottom:10px;">+ Add Connection</button>
            
            <h3>🇬🇷 Greek Row Order</h3>
            <div id="rowInfo" class="info-text">Rows are set per node in the table above. Nodes on same row share Y level.</div>
            
            <hr>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <button id="applyBtn">🔄 Apply & Refresh Graph</button>
                <button id="resetViewBtn">📍 Reset View</button>
                <button id="exportBtn">💾 Export JSON</button>
                <button id="importBtn">📂 Import JSON</button>
                <input type="file" id="importFile" accept=".json" style="display:none">
            </div>
            <div class="info-text">
                💡 <strong>Preset examples:</strong>
                <button class="preset-btn" data-preset="vercel">Vercel workflows</button>
                <button class="preset-btn" data-preset="simple">Simple CI/CD</button>
            </div>
        </div>
        
        <!-- Right graph canvas -->
        <div class="graph-pane">
            <canvas id="graphCanvas"></canvas>
        </div>
    </div>
    <div class="toolbar">
        <span>✨ Drag nodes | Pan background (drag empty space) | Zoom with wheel</span>
        <span>🔍 Hover node → see runtime steps</span>
    </div>
</div>

<script>
    (function(){
        // ----- data model -----
        let nodes = [];   // { id, name, steps, row, x, y }
        let edges = [];   // { fromId, toId }
        let nextId = 1;
        
        // canvas & interaction state
        const canvas = document.getElementById('graphCanvas');
        let ctx = canvas.getContext('2d');
        let offsetX = 0, offsetY = 0, scale = 1.0;
        let isPanning = false, panStart = { x: 0, y: 0 };
        let draggedNode = null, dragOffset = { x: 0, y: 0 };
        let hoveredNode = null;
        
        // row order & colors
        const rowOrder = ["alpha", "beta", "gamma", "delta", "epsilon", "zeta"];
        const rowColors = [
            { bg: "#d4f1f9", border: "#0077b6", text: "#0c4a6e" },
            { bg: "#ffe6e6", border: "#c2410c", text: "#7f1a1a" },
            { bg: "#e6f4ea", border: "#2e7d32", text: "#14532d" },
            { bg: "#fef9e3", border: "#b45309", text: "#78350f" },
            { bg: "#f3e8ff", border: "#7c3aed", text: "#4c1d95" },
            { bg: "#ffecf0", border: "#db2777", text: "#831843" }
        ];
        
        // Helper: auto-layout nodes based on assigned rows
        function layoutNodes() {
            const w = canvas.width || 900, h = canvas.height || 500;
            const rowsWithNodes = new Map(); // row -> array of node ids
            nodes.forEach(node => { if (!rowsWithNodes.has(node.row)) rowsWithNodes.set(node.row, []); rowsWithNodes.get(node.row).push(node.id); });
            const visibleRows = rowOrder.filter(r => rowsWithNodes.has(r));
            const rowHeight = h / (visibleRows.length + 1);
            let yOffset = rowHeight;
            for (let i = 0; i < visibleRows.length; i++) {
                const rowName = visibleRows[i];
                const nodeIds = rowsWithNodes.get(rowName);
                const spacingX = Math.min(220, (w - 80) / Math.max(1, nodeIds.length));
                let startX = (w - (nodeIds.length - 1) * spacingX) / 2;
                nodeIds.forEach((nodeId, idx) => {
                    const node = nodes.find(n => n.id === nodeId);
                    if (node) {
                        node.x = startX + idx * spacingX;
                        node.y = yOffset + i * rowHeight;
                    }
                });
            }
            // any unassigned row? fallback to alpha
            nodes.forEach(node => { if (node.x === undefined) { node.x = w/2; node.y = h/2; } });
        }
        
        // drawing helpers
        function roundedRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
            ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
            ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
            ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
            ctx.closePath();
        }
        
        function getNodeStyle(row) {
            const idx = rowOrder.indexOf(row);
            return rowColors[Math.max(0, idx % rowColors.length)];
        }
        
        function drawArrow(ctx, from, to) {
            const fromX = from.x * scale + offsetX, fromY = from.y * scale + offsetY;
            const toX = to.x * scale + offsetX, toY = to.y * scale + offsetY;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            const startX = fromX + Math.cos(angle)*35, startY = fromY + Math.sin(angle)*35;
            const endX = toX - Math.cos(angle)*35, endY = toY - Math.sin(angle)*35;
            ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(endX, endY);
            ctx.strokeStyle = "#6c7a91"; ctx.lineWidth = 2; ctx.stroke();
            const arrSize = 8;
            ctx.beginPath(); ctx.moveTo(endX, endY);
            ctx.lineTo(endX - arrSize*Math.cos(angle - Math.PI/6), endY - arrSize*Math.sin(angle - Math.PI/6));
            ctx.lineTo(endX - arrSize*Math.cos(angle + Math.PI/6), endY - arrSize*Math.sin(angle + Math.PI/6));
            ctx.fillStyle = "#4b5a73"; ctx.fill();
        }
        
        function drawNode(ctx, node) {
            const style = getNodeStyle(node.row);
            const w = 180, h = 64;
            const xWorld = node.x - w/2, yWorld = node.y - h/2;
            const sx = xWorld * scale + offsetX, sy = yWorld * scale + offsetY;
            const sw = w * scale, sh = h * scale;
            if (sx + sw < 0 || sx > canvas.width) return;
            ctx.save();
            ctx.shadowBlur = 3; ctx.shadowColor = "rgba(0,0,0,0.05)";
            roundedRect(ctx, sx, sy, sw, sh, 12*scale);
            ctx.fillStyle = style.bg; ctx.fill();
            ctx.strokeStyle = style.border; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.font = `500 ${Math.max(11,12*scale)}px "Segoe UI"`;
            ctx.fillStyle = style.text;
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            const centerX = node.x * scale + offsetX, centerY = node.y * scale + offsetY;
            ctx.fillText(node.name, centerX, centerY - 8*scale);
            ctx.font = `${Math.max(9,10*scale)}px monospace`;
            ctx.fillStyle = "#334155";
            const stepsPreview = node.steps.slice(0,2).join(", ") + (node.steps.length>2 ? "…" : "");
            ctx.fillText(stepsPreview || "no steps", centerX, centerY + 12*scale);
            ctx.restore();
        }
        
        function drawGraph() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            edges.forEach(edge => {
                const fromNode = nodes.find(n => n.id === edge.fromId);
                const toNode = nodes.find(n => n.id === edge.toId);
                if (fromNode && toNode) drawArrow(ctx, fromNode, toNode);
            });
            nodes.forEach(node => drawNode(ctx, node));
            if (hoveredNode) showTooltip(hoveredNode);
            else removeTooltip();
        }
        
        let tooltipDiv = null;
        function showTooltip(node) {
            if (tooltipDiv) tooltipDiv.remove();
            tooltipDiv = document.createElement('div');
            tooltipDiv.style.position = 'fixed'; tooltipDiv.style.background = '#1e293b'; tooltipDiv.style.color = 'white';
            tooltipDiv.style.padding = '6px 12px'; tooltipDiv.style.borderRadius = '20px'; tooltipDiv.style.fontSize = '0.7rem';
            tooltipDiv.style.maxWidth = '280px'; tooltipDiv.style.zIndex = 1000; tooltipDiv.style.backdropFilter = 'blur(4px)';
            const stepsHtml = node.steps.length ? node.steps.map(s => `⚙️ ${s}`).join('<br>') : 'No steps defined';
            tooltipDiv.innerHTML = `<strong>${node.name}</strong><br>${stepsHtml}`;
            document.body.appendChild(tooltipDiv);
            const rect = canvas.getBoundingClientRect();
            const screenX = node.x * scale + offsetX;
            const screenY = node.y * scale + offsetY;
            let left = rect.left + screenX + 15;
            let top = rect.top + screenY - 40;
            if (left + 250 > window.innerWidth) left = rect.left + screenX - 220;
            if (top < 10) top = rect.top + screenY + 20;
            tooltipDiv.style.left = left + 'px'; tooltipDiv.style.top = top + 'px';
        }
        function removeTooltip() { if (tooltipDiv) { tooltipDiv.remove(); tooltipDiv = null; } }
        
        // Interactions (pan / drag / zoom)
        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width; canvas.height = rect.height;
            layoutNodes(); drawGraph();
        }
        function screenToWorld(screenX, screenY, rect) {
            const canvasX = (screenX - rect.left) * (canvas.width / rect.width);
            const canvasY = (screenY - rect.top) * (canvas.height / rect.height);
            return { x: (canvasX - offsetX)/scale, y: (canvasY - offsetY)/scale };
        }
        function getNodeAt(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const world = screenToWorld(clientX, clientY, rect);
            for (let node of nodes) {
                const halfW = 90, halfH = 32;
                if (world.x >= node.x - halfW && world.x <= node.x + halfW && world.y >= node.y - halfH && world.y <= node.y + halfH)
                    return node;
            }
            return null;
        }
        function onMouseDown(e) {
            const node = getNodeAt(e.clientX, e.clientY);
            if (node) {
                draggedNode = node;
                const rect = canvas.getBoundingClientRect();
                const world = screenToWorld(e.clientX, e.clientY, rect);
                dragOffset = { x: node.x - world.x, y: node.y - world.y };
                canvas.style.cursor = "grabbing";
                e.preventDefault(); return;
            }
            isPanning = true;
            const rect = canvas.getBoundingClientRect();
            panStart = { x: (e.clientX - rect.left) * (canvas.width/rect.width), y: (e.clientY - rect.top) * (canvas.height/rect.height) };
            canvas.style.cursor = "grabbing";
        }
        function onMouseMove(e) {
            if (draggedNode) {
                const rect = canvas.getBoundingClientRect();
                const world = screenToWorld(e.clientX, e.clientY, rect);
                draggedNode.x = world.x + dragOffset.x;
                draggedNode.y = world.y + dragOffset.y;
                drawGraph(); return;
            }
            if (isPanning) {
                const rect = canvas.getBoundingClientRect();
                const dx = (e.clientX - rect.left) * (canvas.width/rect.width) - panStart.x;
                const dy = (e.clientY - rect.top) * (canvas.height/rect.height) - panStart.y;
                offsetX += dx; offsetY += dy;
                panStart = { x: (e.clientX - rect.left) * (canvas.width/rect.width), y: (e.clientY - rect.top) * (canvas.height/rect.height) };
                drawGraph(); return;
            }
            const node = getNodeAt(e.clientX, e.clientY);
            if (node !== hoveredNode) { hoveredNode = node; drawGraph(); }
        }
        function onMouseUp() { draggedNode = null; isPanning = false; canvas.style.cursor = "grab"; drawGraph(); }
        function onWheel(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width/rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height/rect.height);
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const newScale = Math.min(2.5, Math.max(0.4, scale * delta));
            const before = { x: (mouseX - offsetX)/scale, y: (mouseY - offsetY)/scale };
            scale = newScale;
            const after = { x: (mouseX - offsetX)/scale, y: (mouseY - offsetY)/scale };
            offsetX += (after.x - before.x) * scale;
            offsetY += (after.y - before.y) * scale;
            drawGraph();
        }
        
        // ----- UI rendering (nodes table, edges list) -----
        function renderNodeTable() {
            const tbody = document.getElementById('nodeTbody');
            tbody.innerHTML = '';
            nodes.forEach((node, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="text" class="node-name" value="${escapeHtml(node.name)}" data-id="${node.id}"></td>
                    <td><textarea class="node-steps" data-id="${node.id}">${node.steps.join(', ')}</textarea></td>
                    <td><select class="node-row" data-id="${node.id}">${rowOrder.map(r => `<option value="${r}" ${node.row === r ? 'selected' : ''}>${r}</option>`).join('')}</select></td>
                    <td><button class="remove-node" data-id="${node.id}">🗑️</button></td>
                `;
                tbody.appendChild(tr);
            });
            attachNodeEvents();
        }
        
        function attachNodeEvents() {
            document.querySelectorAll('.node-name').forEach(inp => inp.addEventListener('change', e => {
                const id = parseInt(inp.dataset.id);
                const node = nodes.find(n => n.id === id);
                if (node) node.name = inp.value;
                layoutNodes(); drawGraph();
            }));
            document.querySelectorAll('.node-steps').forEach(ta => ta.addEventListener('change', e => {
                const id = parseInt(ta.dataset.id);
                const node = nodes.find(n => n.id === id);
                if (node) node.steps = ta.value.split(',').map(s => s.trim()).filter(s=>s);
                drawGraph();
            }));
            document.querySelectorAll('.node-row').forEach(sel => sel.addEventListener('change', e => {
                const id = parseInt(sel.dataset.id);
                const node = nodes.find(n => n.id === id);
                if (node) { node.row = sel.value; layoutNodes(); drawGraph(); }
            }));
            document.querySelectorAll('.remove-node').forEach(btn => btn.addEventListener('click', e => {
                const id = parseInt(btn.dataset.id);
                nodes = nodes.filter(n => n.id !== id);
                edges = edges.filter(e => e.fromId !== id && e.toId !== id);
                renderNodeTable(); renderEdgesUI(); layoutNodes(); drawGraph();
            }));
        }
        
        function renderEdgesUI() {
            const container = document.getElementById('edgesContainer');
            container.innerHTML = '';
            edges.forEach((edge, idx) => {
                const fromNode = nodes.find(n => n.id === edge.fromId);
                const toNode = nodes.find(n => n.id === edge.toId);
                const div = document.createElement('div');
                div.className = 'edge-row';
                div.innerHTML = `
                    <select class="edge-from" data-edgeidx="${idx}">${nodes.map(n => `<option value="${n.id}" ${edge.fromId === n.id ? 'selected' : ''}>${n.name}</option>`).join('')}</select>
                    → 
                    <select class="edge-to" data-edgeidx="${idx}">${nodes.map(n => `<option value="${n.id}" ${edge.toId === n.id ? 'selected' : ''}>${n.name}</option>`).join('')}</select>
                    <button class="remove-edge" data-edgeidx="${idx}">✖️</button>
                `;
                container.appendChild(div);
            });
            document.querySelectorAll('.edge-from').forEach(sel => sel.addEventListener('change', e => {
                const idx = parseInt(sel.dataset.edgeidx);
                edges[idx].fromId = parseInt(sel.value);
                drawGraph();
            }));
            document.querySelectorAll('.edge-to').forEach(sel => sel.addEventListener('change', e => {
                const idx = parseInt(sel.dataset.edgeidx);
                edges[idx].toId = parseInt(sel.value);
                drawGraph();
            }));
            document.querySelectorAll('.remove-edge').forEach(btn => btn.addEventListener('click', e => {
                const idx = parseInt(btn.dataset.edgeidx);
                edges.splice(idx,1);
                renderEdgesUI(); drawGraph();
            }));
        }
        
        function addNode() {
            const newId = nextId++;
            nodes.push({ id: newId, name: `New node ${newId}`, steps: [], row: "alpha", x: 300, y: 200 });
            renderNodeTable(); renderEdgesUI(); layoutNodes(); drawGraph();
        }
        function addEdge() {
            if (nodes.length < 2) return;
            edges.push({ fromId: nodes[0].id, toId: nodes[1].id });
            renderEdgesUI(); drawGraph();
        }
        
        function exportConfig() {
            const config = { nodes: nodes.map(n => ({ name: n.name, steps: n.steps, row: n.row })), edges };
            const dataStr = JSON.stringify(config, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'workflow-graph.json'; a.click(); URL.revokeObjectURL(url);
        }
        function importConfig(file) {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const config = JSON.parse(e.target.result);
                    nodes = config.nodes.map((n, i) => ({ id: nextId++, name: n.name, steps: n.steps || [], row: n.row || 'alpha', x: 200, y: 200 }));
                    edges = config.edges;
                    renderNodeTable(); renderEdgesUI(); layoutNodes(); drawGraph();
                } catch(err) { alert('Invalid JSON'); }
            };
            reader.readAsText(file);
        }
        
        function loadPreset(name) {
            if (name === 'vercel') {
                nodes = [
                    { id: nextId++, name: 'release.yml', steps: ['create changeset PR','publish npm'], row: 'alpha', x:0,y:0 },
                    { id: nextId++, name: 'test.yml', steps: ['unit tests','e2e tests'], row: 'alpha', x:0,y:0 },
                    { id: nextId++, name: 'cron-update-next', steps: ['fetch canary','PR'], row: 'beta', x:0,y:0 },
                    { id: nextId++, name: 'ci-doctor', steps: ['AI diagnosis','create issue'], row: 'gamma', x:0,y:0 },
                ];
                edges = [ { fromId: nodes[0].id, toId: nodes[1].id }, { fromId: nodes[1].id, toId: nodes[3].id } ];
            } else if (name === 'simple') {
                nodes = [
                    { id: nextId++, name: 'Build', steps: ['compile','test'], row: 'alpha', x:0,y:0 },
                    { id: nextId++, name: 'Deploy', steps: ['upload','release'], row: 'beta', x:0,y:0 },
                    { id: nextId++, name: 'Monitor', steps: ['health check','alert'], row: 'gamma', x:0,y:0 },
                ];
                edges = [ { fromId: nodes[0].id, toId: nodes[1].id }, { fromId: nodes[1].id, toId: nodes[2].id } ];
            }
            renderNodeTable(); renderEdgesUI(); layoutNodes(); drawGraph();
        }
        
        function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
        
        // event binding
        function init() {
            resizeCanvas();
            window.addEventListener('resize', () => { resizeCanvas(); layoutNodes(); drawGraph(); });
            canvas.addEventListener('mousedown', onMouseDown); window.addEventListener('mousemove', onMouseMove); window.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('wheel', onWheel, {passive: false});
            document.getElementById('addNodeBtn').addEventListener('click', addNode);
            document.getElementById('addEdgeBtn').addEventListener('click', addEdge);
            document.getElementById('applyBtn').addEventListener('click', () => { layoutNodes(); drawGraph(); });
            document.getElementById('resetViewBtn').addEventListener('click', () => { offsetX=0; offsetY=0; scale=1; drawGraph(); });
            document.getElementById('exportBtn').addEventListener('click', exportConfig);
            document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
            document.getElementById('importFile').addEventListener('change', e => { if(e.target.files[0]) importConfig(e.target.files[0]); });
            document.querySelectorAll('[data-preset]').forEach(btn => btn.addEventListener('click', () => loadPreset(btn.dataset.preset)));
            // default demo
            loadPreset('vercel');
        }
        init();
    })();
</script>
</body>
</html>
