<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dynamic Workflow Graph Generator | Greek Row Ordering</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #eef2f5;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 1400px;
            max-width: 98vw;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .editor-panel {
            padding: 18px 24px;
            background: #f9fafb;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .input-group {
            flex: 1;
            min-width: 200px;
        }
        .input-group label {
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
            display: block;
            margin-bottom: 6px;
        }
        textarea {
            width: 100%;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 8px;
            border-radius: 16px;
            border: 1px solid #cbd5e1;
            background: white;
            resize: vertical;
        }
        .row-control {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        button {
            background: #1e293b;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
        }
        button:hover {
            background: #0f172a;
        }
        .graph-container {
            position: relative;
            height: 550px;
            background: #ffffff;
            border-top: 1px solid #eef2f8;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .info-bar {
            padding: 10px 20px;
            font-size: 0.7rem;
            background: #f1f5f9;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #e2e8f0;
        }
        .legend {
            display: flex;
            gap: 15px;
        }
        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }
        .tooltip-steps {
            position: absolute;
            background: #1e293b;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            pointer-events: none;
            z-index: 100;
            white-space: pre-wrap;
            max-width: 260px;
            backdrop-filter: blur(4px);
        }
        .reset-buttons {
            display: flex;
            gap: 8px;
            margin-left: auto;
            align-items: center;
        }
        @media (max-width: 800px) {
            .editor-panel { flex-direction: column; }
            .reset-buttons { margin-left: 0; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="editor-panel">
        <div class="input-group">
            <label>📦 Nodes (name | runtime steps)</label>
            <textarea id="nodesInput" rows="4" placeholder="One node per line&#10;Format: name | step1, step2, ...&#10;&#10;Example:&#10;release.yml | create PR, run changesets, publish to npm&#10;test.yml | unit tests, e2e tests, upload coverage"></textarea>
        </div>
        <div class="input-group">
            <label>🔗 Edges (from_index,to_index) &nbsp; <span style="font-weight:normal">comma separated</span></label>
            <textarea id="edgesInput" rows="4" placeholder="0,1&#10;2,3&#10;0,3"></textarea>
        </div>
        <div class="input-group">
            <label>🇬🇷 Row order (Greek letters → Y position)</label>
            <textarea id="rowsInput" rows="4" placeholder="alpha: 0,1,2&#10;beta: 3,4&#10;gamma: 5,6,7&#10;&#10;Use node indices (starting 0)"></textarea>
            <div style="font-size:0.65rem; margin-top:4px;">α (alpha) = top row, β = second, etc.</div>
        </div>
        <div class="reset-buttons">
            <button id="generateBtn">✨ Generate Graph</button>
            <button id="resetViewBtn">🔄 Reset View</button>
        </div>
    </div>

    <div class="graph-container">
        <canvas id="graphCanvas"></canvas>
    </div>
    <div class="info-bar">
        <div class="legend">
            <span><div class="color-dot" style="background:#d4f1f9; border:1px solid #0077b6;"></div> Nodes (color by row)</span>
            <span><i class="fas fa-arrows-alt"></i> Drag nodes | Pan background | Zoom wheel</span>
        </div>
        <div>💡 Hover node → see runtime steps</div>
    </div>
</div>

<script>
    (function() {
        // ----- DOM elements -----
        const canvas = document.getElementById('graphCanvas');
        let ctx = canvas.getContext('2d');

        // Data state
        let nodes = [];         // { id, name, steps, x, y, rowKey }
        let edges = [];         // { from, to }
        let rowPositions = {};  // rowName -> { yBase, indices }

        // Pan & zoom & drag state
        let offsetX = 0, offsetY = 0;
        let scale = 1.0;
        let isPanning = false;
        let panStart = { x: 0, y: 0 };
        let draggedNode = null;
        let dragOffsetX = 0, dragOffsetY = 0;
        let hoveredNode = null;
        let tooltipDiv = null;
        let tooltipTimeout = null;

        // Color palette for rows (distinct)
        const rowColors = [
            { bg: "#d4f1f9", border: "#0077b6", text: "#0c4a6e" },  // alpha
            { bg: "#ffe6e6", border: "#c2410c", text: "#7f1a1a" },  // beta
            { bg: "#e6f4ea", border: "#2e7d32", text: "#14532d" },  // gamma
            { bg: "#fef9e3", border: "#b45309", text: "#78350f" },  // delta
            { bg: "#f3e8ff", border: "#7c3aed", text: "#4c1d95" },  // epsilon
            { bg: "#ffecf0", border: "#db2777", text: "#831843" },  // zeta
        ];

        // Helper: parse nodes from textarea
        function parseNodes(text) {
            const lines = text.split(/\r?\n/);
            const result = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line === "") continue;
                let name = line;
                let steps = [];
                if (line.includes("|")) {
                    const parts = line.split("|");
                    name = parts[0].trim();
                    const stepsRaw = parts.slice(1).join("|").trim();
                    if (stepsRaw) steps = stepsRaw.split(",").map(s => s.trim());
                }
                result.push({ id: `node_${i}`, originalIndex: i, name, steps });
            }
            return result;
        }

        // Parse edges: "from,to"
        function parseEdges(text, nodeCount) {
            const lines = text.split(/\r?\n/);
            const edgesList = [];
            for (let line of lines) {
                line = line.trim();
                if (line === "") continue;
                const parts = line.split(",");
                if (parts.length >= 2) {
                    const fromIdx = parseInt(parts[0].trim(), 10);
                    const toIdx = parseInt(parts[1].trim(), 10);
                    if (!isNaN(fromIdx) && !isNaN(toIdx) && fromIdx < nodeCount && toIdx < nodeCount && fromIdx >=0 && toIdx>=0) {
                        edgesList.push({ from: `node_${fromIdx}`, to: `node_${toIdx}` });
                    }
                }
            }
            return edgesList;
        }

        // Parse rows: "alpha: 0,1,2" etc.
        function parseRows(text, nodeCount) {
            const lines = text.split(/\r?\n/);
            const rowMap = new Map(); // rowName -> indices[]
            const greekOrder = ["alpha", "beta", "gamma", "delta", "epsilon", "zeta"];
            for (let line of lines) {
                line = line.trim();
                if (line === "") continue;
                const colonIdx = line.indexOf(":");
                if (colonIdx === -1) continue;
                let rowName = line.substring(0, colonIdx).trim().toLowerCase();
                const indicesStr = line.substring(colonIdx + 1).trim();
                const indices = indicesStr.split(",").map(s => parseInt(s.trim(), 10)).filter(i => !isNaN(i) && i >=0 && i < nodeCount);
                if (indices.length && greekOrder.includes(rowName)) {
                    rowMap.set(rowName, indices);
                }
            }
            // Assign any unassigned nodes to a fallback row (gamma)
            const assignedIndices = new Set();
            for (let indices of rowMap.values()) indices.forEach(i => assignedIndices.add(i));
            const unassigned = [];
            for (let i = 0; i < nodeCount; i++) if (!assignedIndices.has(i)) unassigned.push(i);
            if (unassigned.length) {
                const fallbackRow = "gamma";
                if (!rowMap.has(fallbackRow)) rowMap.set(fallbackRow, []);
                rowMap.set(fallbackRow, [...rowMap.get(fallbackRow), ...unassigned]);
            }
            return rowMap;
        }

        // Layout nodes based on rows (Greek letter order)
        function layoutNodes(rowMap, nodeList, canvasWidth, canvasHeight) {
            const order = ["alpha", "beta", "gamma", "delta", "epsilon", "zeta"];
            const rowsArray = order.filter(r => rowMap.has(r));
            const rowHeight = canvasHeight / (rowsArray.length + 1);
            let startY = rowHeight * 0.8;
            for (let ri = 0; ri < rowsArray.length; ri++) {
                const rowName = rowsArray[ri];
                const indices = rowMap.get(rowName);
                const yPos = startY + ri * rowHeight;
                const spacingX = Math.min(200, (canvasWidth - 100) / Math.max(1, indices.length));
                let startX = (canvasWidth - (indices.length - 1) * spacingX) / 2;
                for (let idxPos = 0; idxPos < indices.length; idxPos++) {
                    const nodeIdx = indices[idxPos];
                    const node = nodeList.find(n => n.originalIndex === nodeIdx);
                    if (node) {
                        node.x = startX + idxPos * spacingX;
                        node.y = yPos;
                        node.rowKey = rowName;
                    }
                }
            }
        }

        // Build full graph from UI input
        function buildGraph() {
            const nodesText = document.getElementById('nodesInput').value;
            const edgesText = document.getElementById('edgesInput').value;
            const rowsText = document.getElementById('rowsInput').value;

            let parsedNodes = parseNodes(nodesText);
            if (parsedNodes.length === 0) {
                parsedNodes = [{ id: "node_0", name: "Example Node", steps: ["demo step"], originalIndex: 0 }];
            }
            const edgesList = parseEdges(edgesText, parsedNodes.length);
            const rowMap = parseRows(rowsText, parsedNodes.length);
            
            // assign initial positions (will be overwritten by layout)
            const canvasRect = canvas.getBoundingClientRect();
            const w = canvasRect.width || 1000;
            const h = canvasRect.height || 550;
            layoutNodes(rowMap, parsedNodes, w, h);
            
            nodes = parsedNodes;
            edges = edgesList;
            drawGraph();
        }

        // ---------- Drawing helpers (same as before but dynamic node styling by row) ----------
        function roundedRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function getStyleForNode(node) {
            const rowKey = node.rowKey || "alpha";
            const rowIndex = ["alpha", "beta", "gamma", "delta", "epsilon", "zeta"].indexOf(rowKey);
            const style = rowColors[Math.max(0, rowIndex % rowColors.length)];
            return style;
        }

        function drawArrow(ctx, from, to) {
            const fromX = from.x * scale + offsetX;
            const fromY = from.y * scale + offsetY;
            const toX = to.x * scale + offsetX;
            const toY = to.y * scale + offsetY;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            const startX = fromX + Math.cos(angle) * 35;
            const startY = fromY + Math.sin(angle) * 35;
            const endX = toX - Math.cos(angle) * 35;
            const endY = toY - Math.sin(angle) * 35;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = "#6c7a91";
            ctx.lineWidth = 2;
            ctx.stroke();
            const arrowSize = 8;
            ctx.beginPath();
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - arrowSize * Math.cos(angle - Math.PI/6), endY - arrowSize * Math.sin(angle - Math.PI/6));
            ctx.lineTo(endX - arrowSize * Math.cos(angle + Math.PI/6), endY - arrowSize * Math.sin(angle + Math.PI/6));
            ctx.fillStyle = "#4b5a73";
            ctx.fill();
        }

        function drawNode(ctx, node) {
            const style = getStyleForNode(node);
            const w = 170;
            const h = 58;
            const xWorld = node.x - w/2;
            const yWorld = node.y - h/2;
            const screenX = xWorld * scale + offsetX;
            const screenY = yWorld * scale + offsetY;
            const screenW = w * scale;
            const screenH = h * scale;
            if (screenX + screenW < 0 || screenX > canvas.width || screenY + screenH < 0 || screenY > canvas.height) return;
            ctx.save();
            ctx.shadowBlur = 3;
            ctx.shadowColor = "rgba(0,0,0,0.08)";
            roundedRect(ctx, screenX, screenY, screenW, screenH, 10 * scale);
            ctx.fillStyle = style.bg;
            ctx.fill();
            ctx.strokeStyle = style.border;
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.shadowBlur = 0;
            let fontSize = Math.max(11, 12 * scale);
            ctx.font = `500 ${fontSize}px "Segoe UI", system-ui`;
            ctx.fillStyle = style.text;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const lines = node.name.split('\n');
            const centerX = (node.x * scale + offsetX);
            const centerY = (node.y * scale + offsetY);
            if (lines.length === 1) {
                ctx.fillText(lines[0], centerX, centerY);
            } else {
                const lineHeight = 16 * scale;
                const startY = centerY - ((lines.length-1) * lineHeight/2);
                for (let i=0; i<lines.length; i++) {
                    ctx.fillText(lines[i], centerX, startY + i * lineHeight);
                }
            }
            ctx.restore();
        }

        function drawGraph() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let edge of edges) {
                const fromNode = nodes.find(n => n.id === edge.from);
                const toNode = nodes.find(n => n.id === edge.to);
                if (fromNode && toNode) drawArrow(ctx, fromNode, toNode);
            }
            for (let node of nodes) drawNode(ctx, node);
            if (hoveredNode) {
                // show tooltip with steps
                if (tooltipDiv) tooltipDiv.remove();
                tooltipDiv = document.createElement('div');
                tooltipDiv.className = 'tooltip-steps';
                const stepsHtml = hoveredNode.steps.length ? hoveredNode.steps.map(s => `⚙️ ${s}`).join('<br>') : 'No runtime steps defined';
                tooltipDiv.innerHTML = `<strong>${hoveredNode.name}</strong><br>${stepsHtml}`;
                document.body.appendChild(tooltipDiv);
                const rect = canvas.getBoundingClientRect();
                const screenX = hoveredNode.x * scale + offsetX;
                const screenY = hoveredNode.y * scale + offsetY;
                let left = rect.left + screenX + 15;
                let top = rect.top + screenY - 40;
                if (left + 250 > window.innerWidth) left = rect.left + screenX - 220;
                if (top < 10) top = rect.top + screenY + 20;
                tooltipDiv.style.left = left + 'px';
                tooltipDiv.style.top = top + 'px';
            } else if (tooltipDiv) {
                tooltipDiv.remove();
                tooltipDiv = null;
            }
        }

        // ---- Interaction: node drag, pan, zoom, hover ----
        function screenToWorld(screenX, screenY, rect) {
            const canvasX = (screenX - rect.left) * (canvas.width / rect.width);
            const canvasY = (screenY - rect.top) * (canvas.height / rect.height);
            return { x: (canvasX - offsetX) / scale, y: (canvasY - offsetY) / scale };
        }

        function getNodeUnderCursor(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const world = screenToWorld(clientX, clientY, rect);
            for (let node of nodes) {
                const halfW = 85, halfH = 29;
                if (world.x >= node.x - halfW && world.x <= node.x + halfW && world.y >= node.y - halfH && world.y <= node.y + halfH)
                    return node;
            }
            return null;
        }

        let mouseX = 0, mouseY = 0;
        function onMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseCanvasX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseCanvasY = (e.clientY - rect.top) * (canvas.height / rect.height);
            if (draggedNode) {
                const worldNow = screenToWorld(e.clientX, e.clientY, rect);
                draggedNode.x = worldNow.x + dragOffsetX;
                draggedNode.y = worldNow.y + dragOffsetY;
                drawGraph();
                return;
            }
            if (isPanning) {
                const dx = mouseCanvasX - panStart.x;
                const dy = mouseCanvasY - panStart.y;
                offsetX += dx;
                offsetY += dy;
                panStart.x = mouseCanvasX;
                panStart.y = mouseCanvasY;
                drawGraph();
                return;
            }
            const node = getNodeUnderCursor(e.clientX, e.clientY);
            if (node !== hoveredNode) {
                hoveredNode = node;
                drawGraph();
            }
        }

        function onMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            const hitNode = getNodeUnderCursor(e.clientX, e.clientY);
            if (hitNode) {
                draggedNode = hitNode;
                const world = screenToWorld(e.clientX, e.clientY, rect);
                dragOffsetX = hitNode.x - world.x;
                dragOffsetY = hitNode.y - world.y;
                canvas.style.cursor = "grabbing";
                e.preventDefault();
                return;
            }
            isPanning = true;
            const canvasX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const canvasY = (e.clientY - rect.top) * (canvas.height / rect.height);
            panStart = { x: canvasX, y: canvasY };
            canvas.style.cursor = "grabbing";
        }

        function onMouseUp() {
            if (draggedNode) { draggedNode = null; drawGraph(); }
            if (isPanning) { isPanning = false; }
            canvas.style.cursor = "grab";
        }

        function onWheel(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseCanvasX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseCanvasY = (e.clientY - rect.top) * (canvas.height / rect.height);
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const newScale = Math.min(2.8, Math.max(0.4, scale * delta));
            const worldBefore = { x: (mouseCanvasX - offsetX) / scale, y: (mouseCanvasY - offsetY) / scale };
            scale = newScale;
            const worldAfter = { x: (mouseCanvasX - offsetX) / scale, y: (mouseCanvasY - offsetY) / scale };
            offsetX += (worldAfter.x - worldBefore.x) * scale;
            offsetY += (worldAfter.y - worldBefore.y) * scale;
            drawGraph();
        }

        function resetView() {
            offsetX = 0; offsetY = 0; scale = 1.0;
            drawGraph();
        }

        function resizeCanvasAndRelayout() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            if (nodes.length) {
                // re-layout based on rows with new canvas dimensions
                const rowMap = new Map();
                for (let node of nodes) {
                    if (node.rowKey) {
                        if (!rowMap.has(node.rowKey)) rowMap.set(node.rowKey, []);
                        rowMap.get(node.rowKey).push(node.originalIndex);
                    }
                }
                layoutNodes(rowMap, nodes, canvas.width, canvas.height);
                drawGraph();
            } else {
                drawGraph();
            }
        }

        function initEvents() {
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('wheel', onWheel, { passive: false });
            canvas.style.cursor = "grab";
            document.getElementById('generateBtn').addEventListener('click', () => {
                buildGraph();
                setTimeout(resizeCanvasAndRelayout, 20);
            });
            document.getElementById('resetViewBtn').addEventListener('click', resetView);
            window.addEventListener('resize', () => resizeCanvasAndRelayout());
        }

        // initial setup
        function init() {
            resizeCanvasAndRelayout();
            initEvents();
            // default demo content (Vercel example)
            document.getElementById('nodesInput').value = `release.yml | create changeset PR, publish to npm, trigger summary
test.yml | run unit tests, run e2e tests, upload coverage
test-lint.yml | enforce changeset, biome lint, type-check
cron-update-next-canary.yml | fetch next canary, update fixture, create PR
ci-doctor.lock.yml | analyze CI logs, create diagnostic issue
agentics-maintenance.yml | close stale discussions, lock expired issues
comment-cli-tarball.yml | post npx instruction on PR`;
            document.getElementById('edgesInput').value = `0,1\n0,2\n1,4\n3,0\n4,5`;
            document.getElementById('rowsInput').value = `alpha: 0,1,2\nbeta: 3,4\ngamma: 5,6`;
            buildGraph();
            setTimeout(resizeCanvasAndRelayout, 50);
        }
        init();
    })();
</script>
</body>
</html>
